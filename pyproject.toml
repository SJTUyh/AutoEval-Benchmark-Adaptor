[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autoeval-benchmark-adaptor"
version = "0.1.0"
description = "统一 JSON 参数格式调用不同测评工具的适配器"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
autoeval-adaptor = "autoeval_adaptor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
